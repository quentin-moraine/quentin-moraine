  <g class="line" style="--d:0.98s">
  <text class="value" x="139.2" y="484.0" textLength="386.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">JARVIS — desktop assistant running a local LLM</text>
  </g>
  <g class="line" style="--d:1.05s">
  <text class="label" x="30.0" y="515.0" textLength="50.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Speaks</text>
  <text class="value" x="139.2" y="515.0" textLength="243.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">FR native · EN C1 (TOEIC 950)</text>
