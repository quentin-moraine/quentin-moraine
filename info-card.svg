  <text class="value" x="139.2" y="205.0" textLength="478.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Modern C++ for robotics · perception · control · embedded</text>
  </g>
  <g class="line" style="--d:0.42s">
