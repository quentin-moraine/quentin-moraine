  <text class="value" x="139.2" y="360.0" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">SolidWorks · Inventor · KiCad · EasyEDA</text>
  </g>
  <g class="line" style="--d:0.77s">
  <text class="label" x="30.0" y="391.0" textLength="42.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Built</text>
  <text class="value" x="139.2" y="391.0" textLength="445.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Vision-based screw sorter — YOLO11 on Pi 5, &gt;95% acc.</text>
  </g>
  <g class="line" style="--d:0.84s">
  <text class="value" x="139.2" y="422.0" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">team lead · 9-month engineering project</text>
