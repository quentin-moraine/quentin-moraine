  <text class="value" x="139.2" y="298.0" textLength="394.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">OpenCV · YOLO/Ultralytics · NumPy · Git · Linux</text>
  </g>
  <g class="line" style="--d:0.63s">
