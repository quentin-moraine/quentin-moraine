<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 557" width="700" height="557" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">
  <title id="title">Quentin Moraine — profile card</title>
  <desc id="desc">Neofetch-style panel: education, focus areas, languages, tools, projects and spoken languages.</desc>
  <style>
    :root {
      --ink: #1f2328;
      --dim: #59636e;
      --faint: #d1d9e0;
      --accent: #1a7f37;
      --heat-0: #ebedf0;
      --heat-1: #aceebb;
      --heat-2: #4ac26b;
      --heat-3: #2da44e;
      --heat-4: #116329;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6edf3;
        --dim: #9198a1;
        --faint: #3d444d;
        --accent: #3fb950;
        --heat-0: #151b23;
        --heat-1: #033a16;
        --heat-2: #196c2e;
        --heat-3: #2ea043;
        --heat-4: #56d364;
      }
    }
    text { font-size: 14.0px; }
    .title { fill: var(--accent); font-size: 18.0px; font-weight: 600; }
    .label { fill: var(--dim); }
    .value { fill: var(--ink); }
    .rule  { stroke: var(--faint); stroke-width: 1; }
    .line  { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
  .line {
    animation: rise 0.5s cubic-bezier(0.25, 1, 0.5, 1) var(--d) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: translateY(0); }
  }
    }
  </style>
  <g class="line" style="--d:0.0s">
