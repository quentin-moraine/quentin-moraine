  <text class="value" x="139.2" y="174.0" textLength="327.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Exchange semester — MCAST, Malta (2023)</text>
  </g>
  <g class="line" style="--d:0.35s">
