  <text class="label" x="30.0" y="112.0" textLength="25.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Now</text>
  <text class="value" x="139.2" y="112.0" textLength="378.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">MSc Robotics — Cranfield University (2026–27)</text>
  </g>
  <g class="line" style="--d:0.21s">
